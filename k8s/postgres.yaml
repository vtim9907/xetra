# PostgreSQL：叢集內的 DB Pod（StatefulSet + 專屬 PVC）。
# 資料存在 volumeClaimTemplates 產生的 PVC（pgdata-postgres-0），
# 與 Pod 生命週期無關：重啟、改版、刪除 Pod 都不會動到資料。
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: artex
            - name: POSTGRES_DB
              value: artex
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: artex-secrets
                  key: POSTGRES_PASSWORD
            # 掛載進來的 volume 根目錄會有 lost+found，initdb 會拒絕使用；
            # 固定用子目錄存放資料。
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "artex", "-d", "artex"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        # 叢集有指定 storageClass 的話在這裡加 storageClassName
        resources:
          requests:
            storage: 10Gi
